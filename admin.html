<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impacto Dental | Administración</title>
<style>
:root{--p:#073b3a;--p2:#0b504c;--a:#18d7c4;--ink:#152222;--muted:#667575;--bg:#f3f8f7;--line:#d9e7e4;--white:#fff;--danger:#a33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}.top{background:var(--p);color:#fff;padding:16px 4vw}.topin{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand b{font-size:19px}.brand small{display:block;color:#b8eee7}.wrap{max-width:1400px;margin:22px auto;padding:0 4vw}.login{max-width:430px;margin:9vh auto;background:#fff;padding:28px;border-radius:18px;border:1px solid var(--line)}h1,h2,h3{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea,.edit{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.primary{border:0;background:var(--a);color:#043431;font-weight:900;border-radius:10px;padding:11px 14px;cursor:pointer}.dark{background:var(--p);color:#fff}.ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.danger{border-color:#e4b9b9;color:var(--danger)}.hidden{display:none!important}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font-size:25px;margin-top:6px;color:var(--p)}
.toolbar{display:flex;gap:10px;margin:14px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.toolbar input{flex:1}
.tablebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f7fbfa;font-size:11px;text-transform:uppercase}.pill{padding:5px 8px;border-radius:999px;background:#e6f4f1;font-size:10px;font-weight:900;white-space:nowrap}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:20px}.box{background:#fff;width:min(1050px,100%);max-height:94vh;overflow:auto;border-radius:16px;padding:20px}.head{display:flex;justify-content:space-between;gap:12px}.x{border:0;background:none;font-size:26px}.detail table{min-width:760px}.num{width:115px;padding:8px;border:1px solid var(--line);border-radius:7px}.summary{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:18px}.totals{background:#f7fbfa;padding:15px;border-radius:12px}.line{display:flex;justify-content:space-between;margin:8px 0}.big{font-size:20px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.msg{padding:10px;border-radius:9px;background:#e9f8f5;margin:10px 0}.err{background:#fdeeee;color:#7b2525}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.topin{gap:10px}.wrap{padding:0 14px}}
</style></head>
<body>
<header class="top"><div class="topin"><div class="brand"><b>IMPACTO DENTAL · ADMIN</b><small>Gestión comercial</small></div><div><span id="who"></span> <button id="logout" class="ghost hidden" onclick="salir()">Salir</button></div></div></header>

<div id="loginView" class="login">
<h2>Ingresar al panel</h2><p style="color:#667575">Cotizaciones, ventas y stock.</p>
<div id="loginMsg"></div>
<div class="field"><label>Email</label><input id="email" type="email"></div>
<div class="field"><label>Contraseña</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div>
<button class="primary dark" style="width:100%" onclick="login()">INGRESAR</button>
</div>

<main id="appView" class="wrap hidden">
<div class="cards">
 <div class="kpi"><small>Nuevas</small><strong id="k1">0</strong></div>
 <div class="kpi"><small>En revisión</small><strong id="k2">0</strong></div>
 <div class="kpi"><small>Cotizadas / aprobadas</small><strong id="k3">0</strong></div>
 <div class="kpi"><small>Ventas del mes</small><strong id="k4">0</strong></div>
 <div class="kpi"><small>Facturación del mes</small><strong id="k5">$ 0</strong></div>
</div>
<div class="toolbar"><input id="search" placeholder="Buscar cliente, cotización, teléfono..." oninput="renderList()"><select id="state" onchange="renderList()"><option value="">Todos los estados</option><option>ENVIADA</option><option>EN REVISIÓN</option><option>COTIZADA</option><option>APROBADA</option><option>CONVERTIDA</option><option>RECHAZADA</option><option>VENCIDA</option></select><button class="ghost" onclick="cargar()">Actualizar</button></div>
<div class="tablebox"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Contacto</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
</main>

<div id="modal" class="modal hidden"><div class="box"><div class="head"><div><h2 id="mtitle"></h2><div id="msub" style="color:#667575"></div></div><button class="x" onclick="closeModal()">×</button></div><div id="modalMsg"></div><div id="detail" class="detail"></div></div></div>

<script>
const CONFIG={API_URL:"PEGAR_ACA_LA_URL_DEL_WEB_APP_DE_APPS_SCRIPT"};
let token=sessionStorage.getItem("impacto_admin_token")||"",quotes=[],current=null;
document.addEventListener("DOMContentLoaded",()=>{if(token)cargar();});

async function apiPost(data){const r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)}),j=await r.json();if(!j.ok)throw Error(j.error||"Error");return j}
async function apiGet(action,params={}){const u=new URL(CONFIG.API_URL);u.searchParams.set("accion",action);u.searchParams.set("token",token);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u),j=await r.json();if(!j.ok)throw Error(j.error||"Error");return j}

async function login(){try{msg("loginMsg","Ingresando...");const j=await apiPost({accion:"adminLogin",email:v("email"),password:v("password")});token=j.token;sessionStorage.setItem("impacto_admin_token",token);await cargar()}catch(e){msg("loginMsg",e.message,true)}}
async function cargar(){try{const j=await apiGet("adminResumen");quotes=j.cotizaciones||[];showApp(j.usuario);const r=j.resumen;k1.textContent=r.nuevas;k2.textContent=r.revision;k3.textContent=r.cotizadas;k4.textContent=r.ventasMes;k5.textContent=money(r.facturacionMes);renderList()}catch(e){salir(false);msg("loginMsg",e.message,true)}}
function showApp(u){loginView.classList.add("hidden");appView.classList.remove("hidden");logout.classList.remove("hidden");who.textContent=u.nombre||u.email}
function salir(reload=true){token="";sessionStorage.removeItem("impacto_admin_token");appView.classList.add("hidden");logout.classList.add("hidden");loginView.classList.remove("hidden");who.textContent="";if(reload)location.reload()}
function renderList(){const q=v("search").toLowerCase(),s=v("state");const a=quotes.filter(x=>(!s||x.estado===s)&&(!q||(`${x.id} ${x.cliente} ${x.telefono} ${x.email}`).toLowerCase().includes(q)));tbody.innerHTML=a.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${date(x.fecha)}</td><td>${esc(x.cliente)}</td><td>${esc(x.telefono||x.email||"")}</td><td>${money(x.total)}</td><td><span class="pill">${esc(x.estado)}</span></td><td><button class="ghost" onclick="openQuote('${js(x.id)}')">Abrir</button></td></tr>`).join("")||'<tr><td colspan="7">Sin resultados.</td></tr>'}
async function openQuote(id){modal.classList.remove("hidden");detail.innerHTML="Cargando...";try{const j=await apiGet("adminCotizacion",{id});current=j.cotizacion;renderQuote()}catch(e){detail.innerHTML=esc(e.message)}}
function renderQuote(){const c=current;mtitle.textContent=c.id;msub.textContent=`${c.cliente} · ${c.telefono||""} · ${c.email||""}`;detail.innerHTML=`
<table><thead><tr><th>Producto</th><th>Modalidad</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr></thead><tbody>${c.items.map((x,i)=>`<tr><td><b>${esc(x.producto)}</b></td><td>${esc(x.modalidad)}</td><td><input class="num" type="number" min="0" step="1" value="${x.cantidad}" onchange="editItem(${i},'cantidad',this.value)"></td><td><input class="num" type="number" min="0" step="1" value="${x.precioUnitario}" onchange="editItem(${i},'precioUnitario',this.value)"></td><td>${money(x.cantidad*x.precioUnitario)}</td></tr>`).join("")}</tbody></table>
<div class="summary"><div><div class="field"><label>Observaciones</label><textarea id="obs">${esc(c.observaciones||"")}</textarea></div><div class="field"><label>Estado</label><select id="quoteState"><option>EN REVISIÓN</option><option>COTIZADA</option><option>APROBADA</option><option>RECHAZADA</option><option>VENCIDA</option></select></div></div>
<div class="totals"><div class="line"><span>Subtotal</span><b id="sub">${money(calcSub())}</b></div><div class="field"><label>Descuento $</label><input id="discount" type="number" min="0" value="${c.descuento||0}" oninput="recalc()"></div><div class="line big"><span>TOTAL</span><span id="grand">${money(calcTotal())}</span></div></div></div>
<div class="actions"><button class="primary dark" onclick="saveQuote()">Guardar cambios</button><button class="ghost" onclick="pdf()">Descargar PDF</button><button class="ghost" onclick="whatsapp()">WhatsApp</button>${c.estado!=="CONVERTIDA"?'<button class="primary" onclick="confirmSale()">CONFIRMAR VENTA</button>':""}</div>`;
quoteState.value=c.estado==="ENVIADA"?"EN REVISIÓN":c.estado;recalc()}
function editItem(i,k,val){current.items[i][k]=Math.max(0,Number(val)||0);renderQuote()}
function calcSub(){return current.items.reduce((s,x)=>s+(Number(x.cantidad)||0)*(Number(x.precioUnitario)||0),0)}
function calcTotal(){const d=Number(document.getElementById("discount")?.value||current.descuento||0);return Math.max(0,calcSub()-d)}
function recalc(){if(!current)return;sub.textContent=money(calcSub());grand.textContent=money(calcTotal())}
async function saveQuote(){try{const data={id:current.id,estado:v("quoteState"),descuento:Number(v("discount"))||0,observaciones:v("obs"),items:current.items};const j=await apiPost({accion:"adminGuardarCotizacion",token,data});msg("modalMsg","Cambios guardados.");await openQuote(current.id);await cargar()}catch(e){msg("modalMsg",e.message,true)}}
async function pdf(){try{await saveQuote();const j=await apiPost({accion:"adminGenerarPdf",token,idCotizacion:current.id});download64(j.pdfBase64,j.pdfNombre)}catch(e){msg("modalMsg",e.message,true)}}
function whatsapp(){const c=current;if(!c.telefono)return msg("modalMsg","La cotización no tiene WhatsApp.",true);const n=String(c.telefono).replace(/\D/g,"");window.open(`https://wa.me/${n}?text=${encodeURIComponent("Hola "+c.cliente+", te contactamos de Impacto Dental por la cotización "+c.id+".")}`,"_blank")}
async function confirmSale(){try{await saveQuote();const forma=prompt("Forma de pago (Transferencia / Efectivo / Tarjeta / Cuenta corriente / Otro):","Transferencia");if(forma===null)return;if(!confirm("¿Confirmar la venta? Esta acción descontará stock de los productos con modalidad STOCK."))return;const j=await apiPost({accion:"adminConfirmarVenta",token,data:{idCotizacion:current.id,formaPago:forma,observaciones:v("obs")}});msg("modalMsg","✓ Venta "+j.idVenta+" confirmada.");await openQuote(current.id);await cargar()}catch(e){msg("modalMsg",e.message,true)}}
function closeModal(){modal.classList.add("hidden");current=null}
function download64(b64,name){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download=name||"cotizacion.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function msg(id,t,err=false){document.getElementById(id).innerHTML=t?`<div class="msg ${err?"err":""}">${esc(t)}</div>`:""}
function v(id){return document.getElementById(id)?.value?.trim()||""}function money(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(n)||0)}function date(s){return s?new Date(s).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):""}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
</script></body></html>
